[workspace]
members = ["apps/octave-desktop", "crates/octave-core", "crates/octave-provider", "crates/octave-player"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
[workspace.dependencies]
octave-core = { path = "crates/octave-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
[workspace.lints.rust]
unsafe_code = "forbid"
[profile.release]
lto = "thin"
strip = true
