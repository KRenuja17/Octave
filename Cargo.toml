[workspace]
members = ["apps/octave-desktop", "crates/octave-core", "crates/octave-provider", "crates/octave-player", "crates/octave-update"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
[workspace.dependencies]
octave-core = { path = "crates/octave-core" }
octave-provider = { path = "crates/octave-provider" }
octave-player = { path = "crates/octave-player" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.149"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-wav", "symphonia-pcm"] }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
[workspace.lints.rust]
unsafe_code = "forbid"
[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
ecolor = { path = "vendor/egui/ecolor" }
emath = { path = "vendor/egui/emath" }
epaint = { path = "vendor/egui/epaint" }
epaint_default_fonts = { path = "vendor/egui/epaint_default_fonts" }
egui = { path = "vendor/egui/egui" }
egui-winit = { path = "vendor/egui/egui-winit" }
egui_glow = { path = "vendor/egui/egui_glow" }
eframe = { path = "vendor/egui/eframe" }
