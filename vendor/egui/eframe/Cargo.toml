
["package"]
"name" = "eframe"
"version" = "0.36.2"
"authors" = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
"description" = "egui framework - write GUI apps that compiles to web and/or natively"
"edition" = "2024"
"rust-version" = "1.95"
"homepage" = "https://github.com/emilk/egui/tree/main/crates/eframe"
"license" = "MIT OR Apache-2.0"
"readme" = "README.md"
"repository" = "https://github.com/emilk/egui/tree/main/crates/eframe"
"categories" = ["gui", "game-development"]
"keywords" = ["egui", "gui", "gamedev"]
"publish" = false
"autoexamples" = false
"autobenches" = false

["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"all-features" = true
"targets" = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
"rustdoc-args" = ["--generate-link-to-definition"]

["lints"]

["lints"."rust"]
"unsafe_code" = "deny"
"trivial_numeric_casts" = "warn"
"unused_import_braces" = "warn"
"unused_lifetimes" = "warn"
"trivial_casts" = "allow"
"unused_qualifications" = "allow"

["lints"."rust"."future_incompatible"]
"level" = "warn"
"priority" = -1

["lints"."rust"."nonstandard_style"]
"level" = "warn"
"priority" = -1

["lints"."rust"."rust_2018_idioms"]
"level" = "warn"
"priority" = -1

["lints"."rust"."unexpected_cfgs"]
"level" = "warn"
"check-cfg" = ["cfg(web_sys_unstable_apis)"]

["lints"."rustdoc"]
"all" = "warn"

["lints"."clippy"]
"allow_attributes" = "warn"
"as_ptr_cast_mut" = "warn"
"branches_sharing_code" = "warn"
"clear_with_drain" = "warn"
"clone_on_ref_ptr" = "warn"
"coerce_container_to_any" = "warn"
"dbg_macro" = "warn"
"debug_assert_with_mut_call" = "warn"
"default_union_representation" = "warn"
"derive_partial_eq_without_eq" = "warn"
"disallowed_script_idents" = "warn"
"doc_include_without_cfg" = "warn"
"empty_enum_variants_with_brackets" = "warn"
"equatable_if_let" = "warn"
"exit" = "warn"
"fallible_impl_from" = "warn"
"float_cmp_const" = "warn"
"fn_to_numeric_cast_any" = "warn"
"get_unwrap" = "warn"
"imprecise_flops" = "warn"
"infinite_loop" = "warn"
"iter_on_empty_collections" = "warn"
"iter_on_single_items" = "warn"
"iter_over_hash_type" = "warn"
"large_include_file" = "warn"
"large_stack_frames" = "warn"
"literal_string_with_formatting_args" = "warn"
"lossy_float_literal" = "warn"
"map_err_ignore" = "warn"
"mem_forget" = "warn"
"missing_assert_message" = "warn"
"mutex_integer" = "warn"
"needless_pass_by_ref_mut" = "warn"
"needless_type_cast" = "warn"
"non_zero_suggestions" = "warn"
"nonstandard_macro_braces" = "warn"
"or_fun_call" = "warn"
"path_buf_push_overwrite" = "warn"
"pathbuf_init_then_push" = "warn"
"precedence_bits" = "warn"
"print_stderr" = "warn"
"print_stdout" = "warn"
"pub_without_shorthand" = "warn"
"rc_mutex" = "warn"
"redundant_type_annotations" = "warn"
"ref_patterns" = "warn"
"rest_pat_in_fully_bound_structs" = "warn"
"return_and_then" = "warn"
"set_contains_or_insert" = "warn"
"single_option_map" = "warn"
"std_instead_of_core" = "warn"
"str_to_string" = "warn"
"string_add" = "warn"
"string_lit_as_bytes" = "warn"
"string_lit_chars_any" = "warn"
"suspicious_xor_used_as_pow" = "warn"
"todo" = "warn"
"too_long_first_doc_paragraph" = "warn"
"trailing_empty_array" = "warn"
"trait_duplication_in_bounds" = "warn"
"tuple_array_conversions" = "warn"
"undocumented_unsafe_blocks" = "warn"
"unimplemented" = "warn"
"uninhabited_references" = "warn"
"unnecessary_safety_comment" = "warn"
"unnecessary_safety_doc" = "warn"
"unnecessary_self_imports" = "warn"
"unnecessary_struct_initialization" = "warn"
"unused_peekable" = "warn"
"unused_rounding" = "warn"
"unused_trait_names" = "warn"
"unwrap_used" = "warn"
"use_self" = "warn"
"useless_let_if_seq" = "warn"
"verbose_file_reads" = "warn"
"cast_lossless" = "allow"
"cast_possible_truncation" = "allow"
"cast_possible_wrap" = "allow"
"cast_precision_loss" = "allow"
"cast_sign_loss" = "allow"
"comparison_chain" = "allow"
"default_trait_access" = "allow"
"float_cmp" = "allow"
"inline_always" = "allow"
"items_after_statements" = "allow"
"many_single_char_names" = "allow"
"missing_panics_doc" = "allow"
"must_use_candidate" = "allow"
"redundant_closure_for_method_calls" = "allow"
"return_self_not_must_use" = "allow"
"should_panic_without_expect" = "allow"
"similar_names" = "allow"
"struct_excessive_bools" = "allow"
"struct_field_names" = "allow"
"too_many_lines" = "allow"
"trivially_copy_pass_by_ref" = "allow"
"unreadable_literal" = "allow"
"used_underscore_binding" = "allow"
"assigning_clones" = "allow"
"manual_range_contains" = "allow"
"map_unwrap_or" = "allow"
"multiple_crate_versions" = "allow"
"wildcard_imports" = "allow"
"let_underscore_must_use" = "allow"
"let_underscore_untyped" = "allow"
"self_named_module_files" = "allow"
"significant_drop_tightening" = "allow"

["lints"."clippy"."all"]
"level" = "warn"
"priority" = -1

["lints"."clippy"."cargo"]
"level" = "warn"
"priority" = -1

["lints"."clippy"."pedantic"]
"level" = "warn"
"priority" = -1

["lib"]

["features"]
"default" = ["accesskit", "default_fonts", "links", "system_fonts", "wayland", "web_screen_reader", "wgpu", "winit/default", "x11"]
"accesskit" = ["egui-winit/accesskit"]
"android-game-activity" = ["egui-winit/android-game-activity"]
"android-native-activity" = ["egui-winit/android-native-activity"]
"default_fonts" = ["egui/default_fonts"]
"experimental" = ["egui/experimental"]
"glow" = ["dep:egui_glow", "dep:glow", "dep:glutin-winit", "dep:glutin"]
"persistence" = ["egui-winit/serde", "egui/persistence", "ron", "serde"]
"wayland" = ["egui-winit/wayland", "egui-wgpu?/wayland", "egui_glow?/wayland", "glutin?/wayland", "glutin-winit?/wayland"]
"system_fonts" = ["dep:egui_system_fonts"]
"web_screen_reader" = ["web-sys/SpeechSynthesis", "web-sys/SpeechSynthesisUtterance"]
"wgpu" = ["wgpu_no_default_features", "egui-wgpu/default"]
"wgpu_no_default_features" = ["dep:wgpu", "dep:egui-wgpu", "dep:pollster"]
"x11" = ["egui-winit/x11", "egui-wgpu?/x11", "egui_glow?/x11", "glutin?/x11", "glutin?/glx", "glutin-winit?/x11", "glutin-winit?/glx"]
"__screenshot" = []
"inspection" = ["dep:egui_inspection", "accesskit"]
"links" = ["egui-winit/links"]

["dependencies"]

["dependencies"."egui"]
"version" = "0.36.2"
"path" = "../egui"
"default-features" = false
"features" = ["bytemuck"]

["dependencies"."ahash"]
"version" = "0.8.12"
"default-features" = false
"features" = ["no-rng", "std"]

["dependencies"."document-features"]
"version" = "0.2.12"

["dependencies"."log"]
"version" = "0.4.34"
"features" = ["std"]

["dependencies"."parking_lot"]
"version" = "0.12.5"

["dependencies"."profiling"]
"version" = "1.0"
"default-features" = false

["dependencies"."raw-window-handle"]
"version" = "0.6.2"

["dependencies"."static_assertions"]
"version" = "1.1"

["dependencies"."web-time"]
"version" = "1.1"

["dependencies"."egui_glow"]
"version" = "0.36.2"
"path" = "../egui_glow"
"default-features" = false
"optional" = true

["dependencies"."egui_inspection"]
"version" = "0.36.2"
"default-features" = false
"optional" = true
"features" = ["plugin"]

["dependencies"."glow"]
"version" = "0.17.0"
"optional" = true

["dependencies"."ron"]
"version" = "0.12.2"
"optional" = true
"features" = ["integer128"]

["dependencies"."serde"]
"version" = "1.0"
"features" = ["derive"]
"optional" = true

["target"]

["target"."cfg(not(target_arch = \"wasm32\"))"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."egui-winit"]
"version" = "0.36.2"
"path" = "../egui-winit"
"default-features" = false
"features" = ["clipboard"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."image"]
"version" = "0.25.10"
"default-features" = false
"features" = ["png"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."winit"]
"version" = "0.30.13"
"default-features" = false
"features" = ["rwh_06"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."egui_system_fonts"]
"version" = "0.36.2"
"default-features" = false
"optional" = true

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."egui-wgpu"]
"version" = "0.36.2"
"default-features" = false
"optional" = true
"features" = ["winit", "capture"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."pollster"]
"version" = "1.0"
"optional" = true

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."glutin"]
"version" = "0.32.3"
"default-features" = false
"optional" = true
"features" = ["egl", "wgl"]

["target"."cfg(not(target_arch = \"wasm32\"))"."dependencies"."glutin-winit"]
"version" = "0.5.0"
"default-features" = false
"optional" = true
"features" = ["egl", "wgl"]

["target"."cfg(any(target_os = \"macos\"))"]

["target"."cfg(any(target_os = \"macos\"))"."dependencies"]

["target"."cfg(any(target_os = \"macos\"))"."dependencies"."objc2"]
"version" = "0.6.4"

["target"."cfg(any(target_os = \"macos\"))"."dependencies"."objc2-foundation"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "block2", "NSData", "NSString"]

["target"."cfg(any(target_os = \"macos\"))"."dependencies"."objc2-app-kit"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"]

["target"."cfg(any(target_os = \"windows\"))"]

["target"."cfg(any(target_os = \"windows\"))"."dependencies"]

["target"."cfg(any(target_os = \"windows\"))"."dependencies"."windows-sys"]
"version" = "0.61.2"
"features" = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

["target"."cfg(target_arch = \"wasm32\")"]

["target"."cfg(target_arch = \"wasm32\")"."dependencies"]

["target"."cfg(target_arch = \"wasm32\")"."dependencies"."bytemuck"]
"version" = "1.25"

["target"."cfg(target_arch = \"wasm32\")"."dependencies"."image"]
"version" = "0.25.10"
"default-features" = false
"features" = ["png"]

