
["package"]
"name" = "egui"
"version" = "0.36.2"
"authors" = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
"description" = "An easy-to-use immediate mode GUI that runs on both web and native"
"edition" = "2024"
"rust-version" = "1.95"
"homepage" = "https://github.com/emilk/egui"
"license" = "MIT OR Apache-2.0"
"readme" = "../../README.md"
"repository" = "https://github.com/emilk/egui"
"categories" = ["gui", "game-development"]
"keywords" = ["gui", "imgui", "immediate", "portable", "gamedev"]
"publish" = false
"autoexamples" = false
"autobenches" = false

["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"all-features" = true
"rustdoc-args" = ["--generate-link-to-definition"]
"targets" = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

["lints"]

["lints"."rust"]
"unsafe_code" = "deny"
"trivial_numeric_casts" = "warn"
"unused_import_braces" = "warn"
"unused_lifetimes" = "warn"
"trivial_casts" = "allow"
"unused_qualifications" = "allow"

["lints"."rust"."future_incompatible"]
"level" = "warn"
"priority" = -1

["lints"."rust"."nonstandard_style"]
"level" = "warn"
"priority" = -1

["lints"."rust"."rust_2018_idioms"]
"level" = "warn"
"priority" = -1

["lints"."rust"."unexpected_cfgs"]
"level" = "warn"
"check-cfg" = ["cfg(web_sys_unstable_apis)"]

["lints"."rustdoc"]
"all" = "warn"

["lints"."clippy"]
"allow_attributes" = "warn"
"as_ptr_cast_mut" = "warn"
"branches_sharing_code" = "warn"
"clear_with_drain" = "warn"
"clone_on_ref_ptr" = "warn"
"coerce_container_to_any" = "warn"
"dbg_macro" = "warn"
"debug_assert_with_mut_call" = "warn"
"default_union_representation" = "warn"
"derive_partial_eq_without_eq" = "warn"
"disallowed_script_idents" = "warn"
"doc_include_without_cfg" = "warn"
"empty_enum_variants_with_brackets" = "warn"
"equatable_if_let" = "warn"
"exit" = "warn"
"fallible_impl_from" = "warn"
"float_cmp_const" = "warn"
"fn_to_numeric_cast_any" = "warn"
"get_unwrap" = "warn"
"imprecise_flops" = "warn"
"infinite_loop" = "warn"
"iter_on_empty_collections" = "warn"
"iter_on_single_items" = "warn"
"iter_over_hash_type" = "warn"
"large_include_file" = "warn"
"large_stack_frames" = "warn"
"literal_string_with_formatting_args" = "warn"
"lossy_float_literal" = "warn"
"map_err_ignore" = "warn"
"mem_forget" = "warn"
"missing_assert_message" = "warn"
"mutex_integer" = "warn"
"needless_pass_by_ref_mut" = "warn"
"needless_type_cast" = "warn"
"non_zero_suggestions" = "warn"
"nonstandard_macro_braces" = "warn"
"or_fun_call" = "warn"
"path_buf_push_overwrite" = "warn"
"pathbuf_init_then_push" = "warn"
"precedence_bits" = "warn"
"print_stderr" = "warn"
"print_stdout" = "warn"
"pub_without_shorthand" = "warn"
"rc_mutex" = "warn"
"redundant_type_annotations" = "warn"
"ref_patterns" = "warn"
"rest_pat_in_fully_bound_structs" = "warn"
"return_and_then" = "warn"
"set_contains_or_insert" = "warn"
"single_option_map" = "warn"
"std_instead_of_core" = "warn"
"str_to_string" = "warn"
"string_add" = "warn"
"string_lit_as_bytes" = "warn"
"string_lit_chars_any" = "warn"
"suspicious_xor_used_as_pow" = "warn"
"todo" = "warn"
"too_long_first_doc_paragraph" = "warn"
"trailing_empty_array" = "warn"
"trait_duplication_in_bounds" = "warn"
"tuple_array_conversions" = "warn"
"undocumented_unsafe_blocks" = "warn"
"unimplemented" = "warn"
"uninhabited_references" = "warn"
"unnecessary_safety_comment" = "warn"
"unnecessary_safety_doc" = "warn"
"unnecessary_self_imports" = "warn"
"unnecessary_struct_initialization" = "warn"
"unused_peekable" = "warn"
"unused_rounding" = "warn"
"unused_trait_names" = "warn"
"unwrap_used" = "warn"
"use_self" = "warn"
"useless_let_if_seq" = "warn"
"verbose_file_reads" = "warn"
"cast_lossless" = "allow"
"cast_possible_truncation" = "allow"
"cast_possible_wrap" = "allow"
"cast_precision_loss" = "allow"
"cast_sign_loss" = "allow"
"comparison_chain" = "allow"
"default_trait_access" = "allow"
"float_cmp" = "allow"
"inline_always" = "allow"
"items_after_statements" = "allow"
"many_single_char_names" = "allow"
"missing_panics_doc" = "allow"
"must_use_candidate" = "allow"
"redundant_closure_for_method_calls" = "allow"
"return_self_not_must_use" = "allow"
"should_panic_without_expect" = "allow"
"similar_names" = "allow"
"struct_excessive_bools" = "allow"
"struct_field_names" = "allow"
"too_many_lines" = "allow"
"trivially_copy_pass_by_ref" = "allow"
"unreadable_literal" = "allow"
"used_underscore_binding" = "allow"
"assigning_clones" = "allow"
"manual_range_contains" = "allow"
"map_unwrap_or" = "allow"
"multiple_crate_versions" = "allow"
"wildcard_imports" = "allow"
"let_underscore_must_use" = "allow"
"let_underscore_untyped" = "allow"
"self_named_module_files" = "allow"
"significant_drop_tightening" = "allow"

["lints"."clippy"."all"]
"level" = "warn"
"priority" = -1

["lints"."clippy"."cargo"]
"level" = "warn"
"priority" = -1

["lints"."clippy"."pedantic"]
"level" = "warn"
"priority" = -1

["lib"]

["features"]
"default" = ["default_fonts"]
"bytemuck" = ["epaint/bytemuck"]
"callstack" = ["dep:backtrace"]
"cint" = ["epaint/cint"]
"color-hex" = ["epaint/color-hex"]
"default_fonts" = ["epaint/default_fonts"]
"experimental" = []
"mint" = ["epaint/mint"]
"monochrome_emoji_fonts" = ["default_fonts", "epaint/monochrome_emoji_fonts"]
"persistence" = ["serde", "epaint/serde", "ron"]
"rayon" = ["epaint/rayon"]
"serde" = ["dep:serde", "epaint/serde", "accesskit/serde"]
"unity" = ["epaint/unity"]
"_override_unity" = ["epaint/_override_unity"]

["dependencies"]

["dependencies"."emath"]
"version" = "0.36.2"
"path" = "../emath"
"default-features" = false

["dependencies"."epaint"]
"version" = "0.36.2"
"path" = "../epaint"
"default-features" = false

["dependencies"."accesskit"]
"version" = "0.24.1"

["dependencies"."ahash"]
"version" = "0.8.12"
"default-features" = false
"features" = ["no-rng", "std"]

["dependencies"."bitflags"]
"version" = "2.13"

["dependencies"."itertools"]
"version" = "0.15.0"

["dependencies"."log"]
"version" = "0.4.34"
"features" = ["std"]

["dependencies"."nohash-hasher"]
"version" = "0.2.0"

["dependencies"."profiling"]
"version" = "1.0"
"default-features" = false

["dependencies"."smallvec"]
"version" = "1.16"

["dependencies"."unicode-segmentation"]
"version" = "1.13"

["dependencies"."backtrace"]
"version" = "0.3.76"
"optional" = true

["dependencies"."document-features"]
"version" = "0.2.12"
"optional" = true

["dependencies"."ron"]
"version" = "0.12.2"
"optional" = true

["dependencies"."serde"]
"version" = "1.0"
"features" = ["derive", "rc"]
"optional" = true

["target"]

["target"."cfg(target_arch = \"wasm32\")"]

["target"."cfg(target_arch = \"wasm32\")"."dependencies"]

["target"."cfg(target_arch = \"wasm32\")"."dependencies"."web-sys"]
"version" = "0.3.103"
"features" = ["File"]

["workspace"]
