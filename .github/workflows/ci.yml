name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_TARGET_DIR: ${{ runner.temp }}/octave-target
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Installer integrity and rollback fixtures
        shell: pwsh
        run: ./packaging/Test-Installer.ps1 -WorkDir "${{ runner.temp }}/octave-installer-tests"
