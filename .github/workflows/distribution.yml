name: Windows evaluation package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Evaluation version (for example 0.2.0-rc.1)
        required: true
        type: string
      sign:
        description: Request approved SignPath signing (requires owner-configured release-signing environment)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  package:
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../octave-target
      OCTAVE_TEST_DIR: ${{ github.workspace }}/../octave-tests
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Existing GNU compiler
        shell: pwsh
        run: |
          if (-not (Test-Path C:/mingw64/bin/gcc.exe)) { throw 'Expected GNU compiler unavailable on runner.' }
          'C:/mingw64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'RUSTUP_TOOLCHAIN=1.99.0-x86_64-pc-windows-gnu' | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force $env:OCTAVE_TEST_DIR | Out-Null
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Package and renderer qualification
        shell: pwsh
        run: |
          ./packaging/Build-Package.ps1 -OutputDir "$env:RUNNER_TEMP/packages" -Version $env:RELEASE_VERSION
          $package = @(Get-ChildItem "$env:RUNNER_TEMP/packages" -Directory -Filter 'Octave-*')
          if ($package.Count -ne 1) { throw 'Expected one package.' }
          "PACKAGE_DIR=$($package[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Installer security fixtures
        shell: pwsh
        run: ./packaging/Test-Installer.ps1 -WorkDir "$env:RUNNER_TEMP/installer-qa"
      - name: Executable product and version metadata
        shell: pwsh
        run: |
          ./packaging/Test-ExecutableMetadata.ps1 -Executable "$env:PACKAGE_DIR/octave-desktop.exe" -Version $env:RELEASE_VERSION
          ./packaging/Test-ExecutableMetadata.ps1 -Executable "$env:PACKAGE_DIR/octave-signature.exe" -Version $env:RELEASE_VERSION -Kind signature
      - name: Signature policy fixtures
        shell: pwsh
        run: |
          ./packaging/Test-SigningPolicy.ps1 -WorkDir "$env:RUNNER_TEMP/signing-qa"
          ./packaging/Test-SignedPackageImport.ps1 -WorkDir "$env:RUNNER_TEMP/signing-import-qa" -DesktopExecutable "$env:PACKAGE_DIR/octave-desktop.exe" -WorkerExecutable "$env:PACKAGE_DIR/octave-signature.exe" -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: windows-evaluation-package
          path: ${{ env.PACKAGE_DIR }}
          retention-days: 7
          if-no-files-found: error
  independent-registration:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-evaluation-package
          path: ${{ runner.temp }}/octave-package
      - name: Registration and restricted-PATH launch on a separate runner
        shell: pwsh
        run: |
          $graphics = ./packaging/Set-UpCiGraphics.ps1 -WorkDir "$env:RUNNER_TEMP/octave-ci-graphics"
          ./packaging/Test-RegisteredPackage.ps1 -PackageDir "$env:RUNNER_TEMP/octave-package" -WorkDir "$env:RUNNER_TEMP/registration-qa" -SoftwareOpenGlDir $graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-registration-evidence
          path: |
            ${{ runner.temp }}/registration-qa/**/result.json
            ${{ runner.temp }}/registration-qa/**/launch-*.log
          retention-days: 7
          if-no-files-found: warn
  sign:
    if: ${{ inputs.sign }}
    needs: [package, independent-registration]
    runs-on: windows-2022
    environment: release-signing
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISHER_THUMBPRINT: ${{ vars.SIGNPATH_PUBLISHER_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Require approved configuration
        shell: pwsh
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_CONFIG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Signing is restricted to reviewed main builds.' }
          foreach ($name in @('SIGNPATH_TOKEN','SIGNPATH_ORG','SIGNPATH_PROJECT','SIGNPATH_POLICY','SIGNPATH_CONFIG','PUBLISHER_THUMBPRINT')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing approved configuration: $name" }
          }
          if ($env:PUBLISHER_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') { throw 'Expected independently verified publisher thumbprint.' }
      - uses: actions/download-artifact@v4
        with:
          name: windows-evaluation-package
          path: ${{ runner.temp }}/unsigned
      - name: Request signing with provider manual approval
        id: signpath
        # Official v3, reviewed/pinned 2026-11-01. No auto-approval policy.
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.package.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/provider-signed
          parameters: |
            version: ${{ toJSON(inputs.version) }}
      - name: Verify and assemble immutable signed package
        shell: pwsh
        run: |
          $signed = ./packaging/Complete-SignedPackage.ps1 -UnsignedPackageDir "$env:RUNNER_TEMP/unsigned" -ProviderPackageDir "$env:RUNNER_TEMP/provider-signed" -OutputDir "$env:RUNNER_TEMP/signed" -ExpectedSourceCommit $env:GITHUB_SHA -PublisherThumbprint $env:PUBLISHER_THUMBPRINT
          "SIGNED_DIR=$signed" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Repeat registration on signed files
        shell: pwsh
        run: |
          $graphics = ./packaging/Set-UpCiGraphics.ps1 -WorkDir "$env:RUNNER_TEMP/signed-ci-graphics"
          ./packaging/Test-RegisteredPackage.ps1 -PackageDir $env:SIGNED_DIR -WorkDir "$env:RUNNER_TEMP/signed-registration" -SoftwareOpenGlDir $graphics
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed-review
          path: |
            ${{ runner.temp }}/signed/*.zip
            ${{ runner.temp }}/signed/*.sha256
            ${{ runner.temp }}/signed/*.review.json
            ${{ runner.temp }}/signed-registration/**/result.json
          retention-days: 7
          if-no-files-found: error
